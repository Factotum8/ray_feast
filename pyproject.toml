[project]
name = "ml-serving-app"
version = "0.1.0"
description = "ML serving app with FastAPI, Ray Serve and Feast"
requires-python = ">=3.10,<3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ray[serve]>=2.9",
    "feast>=0.37",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
]
